<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Muse — переход на сайт</title>
    <meta
      name="description"
      content="Переход к демо-сайту Weather Muse с погодной ведущей, картой и прогнозом погоды."
    />
    <meta http-equiv="refresh" content="0; url=site/" />
    <link rel="canonical" href="site/" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #2f7df6 0%, #151d3b 45%, #090d1f 100%);
        color: #fff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 620px;
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 28px;
        background: rgba(8, 13, 31, 0.68);
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      a {
        color: #8ee6ff;
        font-weight: 700;
      }
    </style>
    <script>
      window.location.replace("site/");
    </script>
  </head>
  <body>
    <main>
      <h1>Weather Muse</h1>
      <p>Открываем сайт с погодной ведущей…</p>
      <p>
        Если переход не сработал автоматически, нажмите
        <a href="site/">открыть сайт</a>.
      </p>
    </main>
  </body>
</html>
